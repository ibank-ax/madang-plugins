name: Public supported CLI installation

on:
  pull_request:
    paths:
      - .github/workflows/client-install.yml
      - scripts/client-install.py
  workflow_dispatch:
    inputs:
      product_set:
        type: choice
        default: madang-six-cae
        options: [madang-six-cae, aca-bootstrap-d83]

env:
  PUBLIC_PRODUCT_SET: ${{ inputs.product_set || (github.head_ref == 'codex/aca-bootstrap-install-1104' && 'aca-bootstrap-d83' || 'madang-six-cae') }}

permissions:
  contents: read

jobs:
  client:
    name: ${{ matrix.client }} public install / capability
    strategy:
      fail-fast: false
      matrix:
        # Cursor's native auth refusal is preserved in run 41743350261.
        # It is not installed/accepted and must not be retried with credentials.
        client: [codex, claude]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native public client only; isolated HOME, no auth or MCP invocation
        run: python3 scripts/client-install.py --client '${{ matrix.client }}' --product-set "$PUBLIC_PRODUCT_SET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-client-${{ env.PUBLIC_PRODUCT_SET }}-${{ matrix.client }}
          if-no-files-found: error
          path: results/client-install/${{ env.PUBLIC_PRODUCT_SET }}/${{ matrix.client }}/
